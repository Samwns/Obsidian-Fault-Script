name: Publish VS Code Extension

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish .vsix to Marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          cd src/vscode-extension
          npm ci

      - name: Publish extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT secret is missing."
            echo "Skipping Marketplace publish; create the secret in repo settings to enable it."
            exit 0
          fi
          cd src/vscode-extension
          node ./node_modules/@vscode/vsce/vsce publish --pat "$VSCE_PAT"
