name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - src/site/**
      - docs/**
      - ofs/dist/ofscc.ll
      - ofs/stdlib/odl.ofs
      - ofs/stdlib/oes.ofs
      - src/packaging/linux/ofs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate site with OFS
        env:
          OFS_STDLIB: ${{ github.workspace }}/ofs/stdlib
        run: |
          cp ofs/dist/magma.ll /tmp/magma.ll
          clang -Wno-override-module -c /tmp/magma.ll -o /tmp/magma.o
          clang -Wno-override-module -Wl,--allow-multiple-definition -O2 ofs/dist/ofscc.ll /tmp/magma.o -lm -o /tmp/ofscc
          chmod +x /tmp/ofscc
          sed 's/__OFS_VERSION__/pages/g' src/packaging/linux/ofs > /tmp/ofs
          chmod +x /tmp/ofs
          OFS_RUNTIME=/tmp/magma.o /tmp/ofs build src/site/src/build_site.ofs -o /tmp/ofs-build-site
          /tmp/ofs-build-site
          cp src/packaging/assets/ofs-256.png docs/assets/ofs-256.png
          cp src/packaging/assets/ofs-256.png docs/ofs-256.png
          cp src/packaging/assets/ofs-256.png src/site/public/assets/ofs-256.png
          cp src/packaging/assets/ofs-256.png src/site/public/ofs-256.png
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
