name: OFS Build & Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'ofs/bootstrap/**'
      - 'ofs/ofscc/**'
      - 'ofs/examples/**'
      - 'ofs/runtime/**'
      - 'ofs/stdlib/**'
      - 'ofs/tests/**'
      - 'src/packaging/**'
      - 'ofs/dist/ofscc.ll'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GITHUB_REPO: Samwns/Obsidian-Fault-Script

jobs:
  build-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build OFS from repository sources
        run: |
          mkdir -p selfhost
          LLVM_IR_FLAGS=()
          clang --version | grep -Eq 'version 14\.|clang-1400\.' && LLVM_IR_FLAGS=(-mllvm -opaque-pointers)
          cp ofs/dist/magma.ll selfhost/magma.ll
          clang -Wno-override-module "${LLVM_IR_FLAGS[@]}" -c selfhost/magma.ll -o selfhost/magma.o
          clang -Wno-override-module "${LLVM_IR_FLAGS[@]}" -Wl,--allow-multiple-definition -no-pie -O2 ofs/dist/ofscc.ll selfhost/magma.o -lm -o selfhost/ofscc
          sed 's/__OFS_VERSION__/ci/g' src/packaging/linux/ofs > selfhost/ofs
          chmod +x selfhost/ofs selfhost/ofscc
          selfhost/ofs version
          OFSCC_INPUT=ofs/tests/selfhost_stdlib_smoke.ofs OFSCC_MODE=check selfhost/ofscc

      - name: Run Examples
        env:
          OFS_STDLIB: ${{ github.workspace }}/ofs/stdlib
        run: |
          for ex in ofs/examples/*.ofs; do
            echo "--- $ex ---"
            (cd "$(dirname "$ex")" && timeout 5 "$GITHUB_WORKSPACE/selfhost/ofs" check "$(basename "$ex")" 2>&1)
          done

      - name: Run stdlib smoke program
        env:
          OFS_STDLIB: ${{ github.workspace }}/ofs/stdlib
        run: |
          selfhost/ofs build ofs/tests/selfhost_stdlib_smoke.ofs -o selfhost/stdlib-smoke
          selfhost/stdlib-smoke
          selfhost/ofs build ofs/tests/ui_stdlib_smoke.ofs -o selfhost/ui-smoke
          selfhost/ui-smoke
          selfhost/ofs build ofs/tests/window_runtime_smoke.ofs -o selfhost/window-smoke
      - name: Run Differential Test Suite (Interpreter vs Native)
        env:
          OFS_STDLIB: ${{ github.workspace }}/ofs/stdlib
          OFS_BIN: ${{ github.workspace }}/selfhost/ofs
          OFSCC: ${{ github.workspace }}/selfhost/ofscc
        run: |
          chmod +x ofs/tests/interpreter/test_differential.sh
          ofs/tests/interpreter/test_differential.sh

      - name: Render golden (Canvas/OLL paint layer)
        env:
          OFS_STDLIB: ${{ github.workspace }}/ofs/stdlib
          OFS_BIN: ${{ github.workspace }}/selfhost/ofs
        run: bash tests/render/run.sh

      - name: Build OFS native wizard installer
        env:
          OFS_STDLIB: ${{ github.workspace }}/ofs/stdlib
        run: |
          selfhost/ofs build src/packaging/installer_wizard_linux.ofs -o selfhost/installer-wizard-linux
          chmod +x selfhost/installer-wizard-linux

  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build OFS from repository sources
        run: |
          mkdir -p selfhost
          cp ofs/dist/magma.ll selfhost/magma.ll
          LLVM_IR_FLAGS=()
          clang --version | grep -Eq 'version 14\.|clang-1400\.' && LLVM_IR_FLAGS=(-mllvm -opaque-pointers)
          clang -Wno-override-module "${LLVM_IR_FLAGS[@]}" -c selfhost/magma.ll -o selfhost/magma.o
          clang -Wno-override-module "${LLVM_IR_FLAGS[@]}" -Wl,-multiply_defined,suppress -Wl,-no_pie -O2 ofs/dist/ofscc.ll selfhost/magma.o -lm -o selfhost/ofscc
          sed 's/__OFS_VERSION__/ci/g' src/packaging/linux/ofs > selfhost/ofs
          chmod +x selfhost/ofs selfhost/ofscc
          selfhost/ofs version
          OFSCC_INPUT=ofs/tests/selfhost_stdlib_smoke.ofs OFSCC_MODE=check selfhost/ofscc

      - name: Run Examples
        env:
          OFS_STDLIB: ${{ github.workspace }}/ofs/stdlib
        run: |
          for ex in ofs/examples/*.ofs; do
            echo "--- $ex ---"
            (cd "$(dirname "$ex")" && "$GITHUB_WORKSPACE/selfhost/ofs" check "$(basename "$ex")" 2>&1)
          done

      - name: Run stdlib smoke program
        env:
          OFS_STDLIB: ${{ github.workspace }}/ofs/stdlib
        run: |
          selfhost/ofs build ofs/tests/selfhost_stdlib_smoke.ofs -o selfhost/stdlib-smoke
          selfhost/stdlib-smoke
          selfhost/ofs build ofs/tests/ui_stdlib_smoke.ofs -o selfhost/ui-smoke
          selfhost/ui-smoke
          selfhost/ofs build ofs/tests/window_runtime_smoke.ofs -o selfhost/window-smoke
          selfhost/window-smoke

      - name: Run Differential Test Suite (Interpreter vs Native)
        env:
          OFS_STDLIB: ${{ github.workspace }}/ofs/stdlib
          OFS_BIN: ${{ github.workspace }}/selfhost/ofs
          OFSCC: ${{ github.workspace }}/selfhost/ofscc
        run: |
          chmod +x ofs/tests/interpreter/test_differential.sh
          ofs/tests/interpreter/test_differential.sh

  build-windows:
    name: Build & Test (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        shell: powershell
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\clang.exe")) {
            choco install llvm -y
          }
          "C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build OFS from repository sources
        shell: powershell
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
          New-Item -ItemType Directory -Path selfhost -Force | Out-Null
          if (Select-String -Path "ofs\dist\magma_windows.ll" -Pattern '@sprintf' -SimpleMatch -Quiet) {
            Write-Error "magma_windows.ll referencia @sprintf (ausente no UCRT). Use snprintf."
            exit 1
          }
          & clang -Wno-override-module -c "ofs\dist\magma_windows.ll" -o "selfhost\magma.o"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $llvmIrFlags = @()
          $clangVersion = (& clang --version | Out-String)
          if ($clangVersion -match 'version 14\.') { $llvmIrFlags = @("-mllvm", "-opaque-pointers") }
          & clang -Wno-override-module @llvmIrFlags "-Wl,/force:multiple" -O2 "ofs\dist\ofscc.ll" "selfhost\magma.o" -lws2_32 -o "selfhost\ofscc.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "src/packaging\windows\ofs.cmd" "selfhost\ofs.cmd"
          (Get-Content "src/packaging\windows\ofs.ps1" -Raw).Replace("__OFS_VERSION__", "ci") | Set-Content "selfhost\ofs.ps1"
          "OFS_CMD=$((Resolve-Path 'selfhost\ofs.cmd').Path)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "OFS_STDLIB=$(((Resolve-Path 'ofs\stdlib').Path).Replace('\', '/'))" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          & "selfhost\ofs.cmd" version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "selfhost\ofscc.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify install
        shell: powershell
        run: |
          & "$env:OFS_CMD" version

      - name: Run Examples
        shell: powershell
        run: |
          Write-Output "Windows ofscc argv/env bridge is not used in CI yet; examples are validated on Linux and macOS."

      - name: Run stdlib smoke program
        shell: powershell
        run: |
          & "selfhost\ofscc.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  docs-check:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          for f in README.md docs/GETTING_STARTED.md docs/LANGUAGE_REFERENCE.md docs/CHANGELOG.md; do
            test -f "$f" && echo "OK: $f" || (echo "MISSING: $f" && exit 1)
          done
