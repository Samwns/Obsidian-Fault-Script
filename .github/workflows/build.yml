name: OFS Build & Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'ofscc/**'
      - 'ofs/examples/**'
      - 'ofs/runtime/**'
      - 'ofs/stdlib/**'
      - 'packaging/**'
      - 'dist/ofscc.ll'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GITHUB_REPO: Samwns/Obsidian-Fault-Script

jobs:
  build-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build OFS from repository sources
        run: |
          mkdir -p selfhost
          clang -O2 -c ofs/runtime/ofs_runtime.c -o selfhost/ofs_runtime.o
          ar rcs selfhost/libofs_runtime.a selfhost/ofs_runtime.o
          clang -Wno-override-module -Xclang -opaque-pointers -O2 dist/ofscc.ll selfhost/libofs_runtime.a -lm -o selfhost/ofscc
          sed 's/__OFS_VERSION__/ci/g' packaging/linux/ofs > selfhost/ofs
          chmod +x selfhost/ofs selfhost/ofscc
          selfhost/ofs version
          OFSCC_INPUT=ofscc/ofscc.ofs OFSCC_MODE=check selfhost/ofscc

      - name: Run Examples
        run: |
          for ex in ofs/examples/*.ofs; do
            echo "--- $ex ---"
            timeout 5 selfhost/ofs check "$ex" 2>&1
          done

      - name: Run stdlib smoke program
        run: |
          selfhost/ofs build ofs/tests/selfhost_stdlib_smoke.ofs -o selfhost/stdlib-smoke
          selfhost/stdlib-smoke

  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build OFS from repository sources
        run: |
          mkdir -p selfhost
          clang -O2 -c ofs/runtime/ofs_runtime.c -o selfhost/ofs_runtime.o
          ar rcs selfhost/libofs_runtime.a selfhost/ofs_runtime.o
          clang -Wno-override-module -Xclang -opaque-pointers -O2 dist/ofscc.ll selfhost/libofs_runtime.a -lm -o selfhost/ofscc
          sed 's/__OFS_VERSION__/ci/g' packaging/linux/ofs > selfhost/ofs
          chmod +x selfhost/ofs selfhost/ofscc
          selfhost/ofs version
          OFSCC_INPUT=ofscc/ofscc.ofs OFSCC_MODE=check selfhost/ofscc

      - name: Run Examples
        run: |
          for ex in ofs/examples/*.ofs; do
            echo "--- $ex ---"
            selfhost/ofs check "$ex" 2>&1
          done

      - name: Run stdlib smoke program
        run: |
          selfhost/ofs build ofs/tests/selfhost_stdlib_smoke.ofs -o selfhost/stdlib-smoke
          selfhost/stdlib-smoke

  build-windows:
    name: Build & Test (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        shell: powershell
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\clang.exe")) {
            choco install llvm -y
          }
          "C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build OFS from repository sources
        shell: powershell
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
          New-Item -ItemType Directory -Path selfhost -Force | Out-Null
          & clang -O2 -c "ofs\runtime\ofs_runtime.c" -o "selfhost\ofs_runtime.obj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & llvm-ar rcs "selfhost\libofs_runtime.a" "selfhost\ofs_runtime.obj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & clang -Wno-override-module -Xclang -opaque-pointers -O2 "dist\ofscc.ll" "selfhost\libofs_runtime.a" -o "selfhost\ofscc.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "packaging\windows\ofs.cmd" "selfhost\ofs.cmd"
          (Get-Content "packaging\windows\ofs.ps1" -Raw).Replace("__OFS_VERSION__", "ci") | Set-Content "selfhost\ofs.ps1"
          "OFS_CMD=$((Resolve-Path 'selfhost\ofs.cmd').Path)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          & "selfhost\ofs.cmd" version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:OFSCC_INPUT = "ofscc\ofscc.ofs"
          $env:OFSCC_MODE = "check"
          & "selfhost\ofscc.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify install
        shell: powershell
        run: |
          & "$env:OFS_CMD" version

      - name: Run Examples
        shell: powershell
        run: |
          Get-ChildItem "ofs\examples\*.ofs" | ForEach-Object {
            Write-Output "--- $($_.Name) ---"
            & "$env:OFS_CMD" check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run stdlib smoke program
        shell: powershell
        run: |
          $smoke = (Resolve-Path "selfhost").Path + "\stdlib-smoke.exe"
          & "$env:OFS_CMD" build "ofs\tests\selfhost_stdlib_smoke.ofs" -o $smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  docs-check:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          for f in README.md docs/GETTING_STARTED.md docs/LANGUAGE_REFERENCE.md docs/CHANGELOG.md; do
            test -f "$f" && echo "OK: $f" || (echo "MISSING: $f" && exit 1)
          done
