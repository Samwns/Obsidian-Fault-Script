name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GITHUB_REPO: Samwns/Obsidian-Fault-Script

jobs:
  version:
    name: Bump version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST" ]; then
            NEW="v1.0.0"
          else
            MAJOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST" | cut -d. -f2)
            PATCH=$(echo "$LATEST" | cut -d. -f3)
            NEW="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "tag=$NEW" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW"
          git push origin "$NEW"

  # ── Linux ────────────────────────────────────────────────────────────
  build-linux:
    name: Build (linux-x64)
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          clang --version
          ar --version

      - name: Build current self-hosted compiler
        run: |
          mkdir -p selfhost
          cp dist/ofscc.ll selfhost/ofscc.ll
          clang -O2 -c ofs/runtime/ofs_runtime.c -o selfhost/ofs_runtime.o
          ar rcs selfhost/libofs_runtime.a selfhost/ofs_runtime.o
          clang -Wno-override-module -Xclang -opaque-pointers -O2 selfhost/ofscc.ll selfhost/libofs_runtime.a -lm -o selfhost/ofscc
          chmod +x selfhost/ofscc
          ./selfhost/ofscc --help
          OFSCC_INPUT=ofscc/ofscc.ofs OFSCC_MODE=check ./selfhost/ofscc

      - name: Build installer tarball
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${TAG#v}"
          STAGING="staging"
          mkdir -p "$STAGING"

          sed "s/__OFS_VERSION__/${VERSION}/g" packaging/linux/ofs > "$STAGING/ofs"
          cp selfhost/ofscc "$STAGING/ofscc"
          chmod +x "$STAGING/ofs"
          cp -r ofs/stdlib "$STAGING/stdlib"
          mkdir -p "$STAGING/ofscc-src"
          cp -r ofscc/* "$STAGING/ofscc-src/"
          cp packaging/linux/install.sh "$STAGING/"
          chmod +x "$STAGING/install.sh"
          for cmd in infuse uncover reinfuse; do
            [ -f "packaging/linux/$cmd" ] && cp "packaging/linux/$cmd" "$STAGING/" && chmod +x "$STAGING/$cmd"
          done
          cp selfhost/libofs_runtime.a "$STAGING/"
          [ -f packaging/assets/ofs-256.png ] && cp packaging/assets/ofs-256.png "$STAGING/ofs.png"
          cp LICENSE "$STAGING/" 2>/dev/null || true

          "$STAGING/ofs" version | grep -F "ofs ${VERSION} - Obsidian Fault Script"
          "$STAGING/ofs" check ofs/examples/webserver_demo.ofs
          "$STAGING/ofs" build ofs/tests/selfhost_stdlib_smoke.ofs -o "$STAGING/stdlib-smoke"
          "$STAGING/stdlib-smoke"
          rm -f "$STAGING/stdlib-smoke"

          ARCHIVE="ofs-linux-x64-installer-${TAG}.tar.gz"
          tar czf "$ARCHIVE" -C "$STAGING" .
          echo "archive=$ARCHIVE" >> "$GITHUB_ENV"
          ls -lh "$ARCHIVE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64-${{ needs.version.outputs.tag }}
          path: ${{ env.archive }}

  # ── macOS ────────────────────────────────────────────────────────────
  build-macos:
    name: Build (macos-arm64)
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify toolchain
        run: clang --version

      - name: Build current self-hosted compiler
        run: |
          mkdir -p selfhost
          cp dist/ofscc.ll selfhost/ofscc.ll
          clang -O2 -c ofs/runtime/ofs_runtime.c -o selfhost/ofs_runtime.o
          ar rcs selfhost/libofs_runtime.a selfhost/ofs_runtime.o
          clang -Wno-override-module -Xclang -opaque-pointers -O2 selfhost/ofscc.ll selfhost/libofs_runtime.a -lm -o selfhost/ofscc
          chmod +x selfhost/ofscc
          ./selfhost/ofscc --help
          OFSCC_INPUT=ofscc/ofscc.ofs OFSCC_MODE=check ./selfhost/ofscc

      - name: Build installer pkg
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${TAG#v}"
          ROOT="pkg-root"
          mkdir -p "$ROOT/usr/local/bin"
          mkdir -p "$ROOT/usr/local/share/ofs/stdlib"
          mkdir -p "$ROOT/usr/local/share/ofs/ofscc-src"

          sed "s/__OFS_VERSION__/${VERSION}/g" packaging/linux/ofs > "$ROOT/usr/local/bin/ofs"
          cp selfhost/ofscc "$ROOT/usr/local/bin/ofscc"
          chmod +x "$ROOT/usr/local/bin/ofs"
          chmod +x "$ROOT/usr/local/bin/ofscc"
          cp ofs/stdlib/*.ofs "$ROOT/usr/local/share/ofs/stdlib/" 2>/dev/null || true
          cp -r ofscc/* "$ROOT/usr/local/share/ofs/ofscc-src/" 2>/dev/null || true
          mkdir -p "$ROOT/usr/local/lib"
          cp selfhost/libofs_runtime.a "$ROOT/usr/local/lib/"

          "$ROOT/usr/local/bin/ofs" version | grep -F "ofs ${VERSION} - Obsidian Fault Script"
          OFS_RUNTIME="$ROOT/usr/local/lib/libofs_runtime.a" "$ROOT/usr/local/bin/ofs" check ofs/examples/webserver_demo.ofs
          OFS_RUNTIME="$ROOT/usr/local/lib/libofs_runtime.a" "$ROOT/usr/local/bin/ofs" build ofs/tests/selfhost_stdlib_smoke.ofs -o "$ROOT/usr/local/bin/stdlib-smoke"
          "$ROOT/usr/local/bin/stdlib-smoke"
          rm -f "$ROOT/usr/local/bin/stdlib-smoke"

          PKG="ofs-macos-arm64-installer-${TAG}.pkg"
          pkgbuild --root "$ROOT" \
            --identifier com.obsidian-fault-script.ofs \
            --version "$VERSION" \
            --install-location / \
            "$PKG"
          echo "pkg=$PKG" >> "$GITHUB_ENV"
          ls -lh "$PKG"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64-${{ needs.version.outputs.tag }}
          path: ${{ env.pkg }}

  # ── Windows ──────────────────────────────────────────────────────────
  build-windows:
    name: Build (windows-x64)
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        shell: powershell
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\clang.exe")) {
            choco install llvm -y
          }
          "C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build current self-hosted compiler
        shell: powershell
        run: |
          $toolDirs = @(
            "C:\Program Files\LLVM\bin",
            "C:\msys64\ucrt64\bin",
            "C:\Program Files\Git\mingw64\bin"
          ) | Where-Object { $_ -and (Test-Path $_) }
          $env:PATH = (($toolDirs -join ";") + ";" + $env:PATH)
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            Write-Error "clang was not found; required to link self-hosted LLVM IR on Windows."
            exit 1
          }
          New-Item -ItemType Directory -Path selfhost -Force | Out-Null
          Copy-Item "dist\ofscc.ll" "selfhost\ofscc.ll"
          & clang -O2 -c "ofs\runtime\ofs_runtime.c" -o "selfhost\ofs_runtime.obj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & llvm-ar rcs "selfhost\libofs_runtime.a" "selfhost\ofs_runtime.obj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & clang -Wno-override-module -Xclang -opaque-pointers -O2 "selfhost\ofscc.ll" "selfhost\libofs_runtime.a" -o "selfhost\ofscc.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "selfhost\ofscc.exe")) {
            Write-Error "Self-hosted compiler was not produced."
            exit 1
          }
          & "selfhost\ofscc.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:OFSCC_INPUT = "ofscc\ofscc.ofs"
          $env:OFSCC_MODE = "check"
          & "selfhost\ofscc.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build portable zip
        shell: powershell
        run: |
          $TAG = "${{ needs.version.outputs.tag }}"
          $Version = $TAG.TrimStart("v")
          $Staging = "portable-staging"
          New-Item -ItemType Directory -Path $Staging -Force | Out-Null

          Copy-Item "selfhost\ofscc.exe" "$Staging\ofscc.exe"
          Copy-Item "selfhost\libofs_runtime.a" "$Staging\libofs_runtime.a"
          Copy-Item "packaging\windows\ofs.cmd" "$Staging\ofs.cmd"
          (Get-Content "packaging\windows\ofs.ps1" -Raw).Replace("__OFS_VERSION__", $Version) | Set-Content "$Staging\ofs.ps1"
          foreach ($cmd in @("infuse", "uncover", "reinfuse")) {
            Copy-Item "packaging\windows\$cmd.ps1" "$Staging\" -ErrorAction SilentlyContinue
            Copy-Item "packaging\windows\$cmd.cmd" "$Staging\" -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Path "$Staging\stdlib" -Force | Out-Null
          Copy-Item "ofs\stdlib\*.ofs" "$Staging\stdlib\" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "$Staging\ofscc" -Force | Out-Null
          Copy-Item "ofscc\*.ofs" "$Staging\ofscc\" -ErrorAction SilentlyContinue
          Copy-Item "ofscc\README.md" "$Staging\ofscc\" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" "$Staging\LICENSE.txt" -ErrorAction SilentlyContinue
          $VersionOutput = & "$Staging\ofs.cmd" version | Out-String
          if ($VersionOutput -notmatch [regex]::Escape("ofs $Version - Obsidian Fault Script")) {
            Write-Error "Packaged ofs version did not match $Version"
            exit 1
          }
          Write-Output $VersionOutput
          & "$Staging\ofs.cmd" check "ofs\examples\webserver_demo.ofs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Smoke = (Resolve-Path $Staging).Path + "\stdlib-smoke.exe"
          & "$Staging\ofs.cmd" build "ofs\tests\selfhost_stdlib_smoke.ofs" -o $Smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item $Smoke -ErrorAction SilentlyContinue

          $ZipName = "ofs-windows-x64-portable-${TAG}.zip"
          Compress-Archive -Path "$Staging\*" -DestinationPath $ZipName -Force
          Write-Output "portable_zip=$ZipName" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-ChildItem $ZipName

      - name: Build NSIS installer
        shell: powershell
        run: |
          $TAG = "${{ needs.version.outputs.tag }}"
          $Version = $TAG.TrimStart("v")
          $RepoRoot = (Get-Location).Path
          $Dist = "$RepoRoot\dist"
          $AssetsDir = "$RepoRoot\packaging\windows"
          New-Item -ItemType Directory -Path $Dist -Force | Out-Null

          Copy-Item "selfhost\ofscc.exe" "$Dist\ofscc.exe"
          Copy-Item "selfhost\libofs_runtime.a" "$Dist\libofs_runtime.a"
          Copy-Item "packaging\windows\ofs.cmd" "$Dist\ofs.cmd"
          (Get-Content "packaging\windows\ofs.ps1" -Raw).Replace("__OFS_VERSION__", $Version) | Set-Content "$Dist\ofs.ps1"
          foreach ($cmd in @("infuse", "uncover", "reinfuse")) {
            Copy-Item "packaging\windows\$cmd.ps1" "$Dist\" -ErrorAction SilentlyContinue
            Copy-Item "packaging\windows\$cmd.cmd" "$Dist\" -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Path "$Dist\stdlib" -Force | Out-Null
          Copy-Item "ofs\stdlib\*.ofs" "$Dist\stdlib\" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" "$Dist\LICENSE.txt" -ErrorAction SilentlyContinue

          $InstallerName = "ofs-windows-x64-installer-${TAG}.exe"
          $InstallerPath = "$RepoRoot\$InstallerName"
          $nsis = Get-Command makensis -ErrorAction SilentlyContinue
          if ($nsis) {
            & makensis `
              "/DOUTPUT=$InstallerPath" `
              "/DDIST_DIR=$Dist" `
              "/DASSETS_DIR=$AssetsDir" `
              packaging\windows\installer.nsi
            Write-Output "installer_exe=$InstallerPath" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          } else {
            Write-Output "::warning::NSIS not found, skipping .exe installer"
            Write-Output "installer_exe=" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          }

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-portable-${{ needs.version.outputs.tag }}
          path: ${{ env.portable_zip }}

      - name: Upload installer exe
        if: env.installer_exe != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-installer-${{ needs.version.outputs.tag }}
          path: ${{ env.installer_exe }}

  # ── VS Code Extension ───────────────────────────────────────────────
  vscode_extension:
    name: Package VS Code Extension
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update extension version
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${TAG#v}"
          node -e "const fs=require('fs');const p='vscode-extension/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='${VERSION}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Package extension
        run: |
          cd vscode-extension
          rm -f *.vsix  
          npm ci
          npm run package

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ needs.version.outputs.tag }}
          path: "vscode-extension/*.vsix"

  # ── Publish ─────────────────────────────────────────────────────────
  publish:
    name: Publish Release
    needs: [version, build-linux, build-macos, build-windows, vscode_extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build changelog
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          PREV=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p')
          if [ -z "$PREV" ]; then
            LOG=$(git log --pretty="- %s (%h)" HEAD)
          else
            LOG=$(git log --pretty="- %s (%h)" ${PREV}..HEAD)
          fi
          printf "## Changes\n\n%s\n" "$LOG" > RELEASE.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.pkg *.zip *.exe *.vsix 2>/dev/null > CHECKSUMS.sha256 || true
          cat CHECKSUMS.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: OFS ${{ needs.version.outputs.tag }}
          body_path: RELEASE.md
          files: |
            artifacts/*.tar.gz
            artifacts/*.pkg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.vsix
            artifacts/CHECKSUMS.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
