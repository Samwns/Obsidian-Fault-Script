name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GITHUB_REPO: Samwns/Obsidian-Fault-Script

jobs:
  version:
    name: Bump version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST" ]; then
            NEW="v1.0.0"
          else
            MAJOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST" | cut -d. -f2)
            PATCH=$(echo "$LATEST" | cut -d. -f3)
            NEW="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "tag=$NEW" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW"
          git push origin "$NEW"

  # ── Linux ────────────────────────────────────────────────────────────
  build-linux:
    name: Build (linux-x64)
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools zstd
          clang --version
          ar --version
          rpmbuild --version
          bsdtar --version
          zstd --version

      - name: Build current self-hosted compiler
        run: |
          mkdir -p selfhost
          cp ofs/dist/ofscc.ll selfhost/ofscc.ll
          clang -O2 -c ofs/runtime/ofs_runtime.c -o selfhost/ofs_runtime.o
          ar rcs selfhost/libofs_runtime.a selfhost/ofs_runtime.o
          LLVM_IR_FLAGS=()
          clang --version | grep -Eq 'version 14\.|clang-1400\.' && LLVM_IR_FLAGS=(-mllvm -opaque-pointers)
          clang -Wno-override-module "${LLVM_IR_FLAGS[@]}" -O2 selfhost/ofscc.ll selfhost/libofs_runtime.a -lm -o selfhost/ofscc
          chmod +x selfhost/ofscc
          ./selfhost/ofscc --help
          OFSCC_INPUT=ofs/tests/selfhost_stdlib_smoke.ofs OFSCC_MODE=check ./selfhost/ofscc

      - name: Build native Linux installers
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${TAG#v}"
          chmod +x src/packaging/linux/build-native-packages.sh
          src/packaging/linux/build-native-packages.sh "$VERSION" "$TAG" selfhost/ofscc selfhost/libofs_runtime.a native-installers

          mkdir -p deb-test
          dpkg-deb -x "native-installers/ofs-debian-ubuntu-x64-installer-${TAG}.deb" deb-test
          deb-test/usr/bin/ofs version | grep -F "ofs ${VERSION} - Obsidian Fault Script"
          OFS_RUNTIME="$PWD/deb-test/usr/lib/ofs/libofs_runtime.a" deb-test/usr/bin/ofs check ofs/examples/webserver_demo.ofs
          (cd ofs/examples && "$GITHUB_WORKSPACE/deb-test/usr/bin/ofs" check bedrock_gateway.ofs)
          OFS_RUNTIME="$PWD/deb-test/usr/lib/ofs/libofs_runtime.a" deb-test/usr/bin/ofs build ofs/tests/selfhost_stdlib_smoke.ofs -o deb-test/stdlib-smoke
          deb-test/stdlib-smoke
          OFS_RUNTIME="$PWD/deb-test/usr/lib/ofs/libofs_runtime.a" deb-test/usr/bin/ofs build ofs/tests/ui_stdlib_smoke.ofs -o deb-test/ui-smoke
          deb-test/ui-smoke
          OFS_RUNTIME="$PWD/deb-test/usr/lib/ofs/libofs_runtime.a" deb-test/usr/bin/ofs build ofs/tests/window_runtime_smoke.ofs -o deb-test/window-smoke
          DISPLAY= deb-test/window-smoke

          echo "linux_installers=native-installers/*${TAG}*" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64-${{ needs.version.outputs.tag }}
          path: ${{ env.linux_installers }}

  # ── macOS ────────────────────────────────────────────────────────────
  build-macos:
    name: Build (macos-arm64)
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify toolchain
        run: clang --version

      - name: Build current self-hosted compiler
        run: |
          mkdir -p selfhost
          cp ofs/dist/ofscc.ll selfhost/ofscc.ll
          clang -O2 -c ofs/runtime/ofs_runtime.c -o selfhost/ofs_runtime.o
          ar rcs selfhost/libofs_runtime.a selfhost/ofs_runtime.o
          LLVM_IR_FLAGS=()
          clang --version | grep -Eq 'version 14\.|clang-1400\.' && LLVM_IR_FLAGS=(-mllvm -opaque-pointers)
          clang -Wno-override-module "${LLVM_IR_FLAGS[@]}" -O2 selfhost/ofscc.ll selfhost/libofs_runtime.a -lm -o selfhost/ofscc
          chmod +x selfhost/ofscc
          ./selfhost/ofscc --help
          OFSCC_INPUT=ofs/tests/selfhost_stdlib_smoke.ofs OFSCC_MODE=check ./selfhost/ofscc

      - name: Build installer pkg
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${TAG#v}"
          ROOT="pkg-root"
          mkdir -p "$ROOT/usr/local/bin"
          mkdir -p "$ROOT/usr/local/share/ofs/stdlib"
          mkdir -p "$ROOT/usr/local/share/ofs/tools"
          mkdir -p "$ROOT/usr/local/share/ofs/ofscc"
          mkdir -p "$ROOT/usr/local/share/ofs/ofscc-src"

          sed "s/__OFS_VERSION__/${VERSION}/g" src/packaging/linux/ofs > "$ROOT/usr/local/bin/ofs"
          cp selfhost/ofscc "$ROOT/usr/local/bin/ofscc"
          chmod +x "$ROOT/usr/local/bin/ofs"
          chmod +x "$ROOT/usr/local/bin/ofscc"
          cp ofs/stdlib/*.ofs "$ROOT/usr/local/share/ofs/stdlib/" 2>/dev/null || true
          cp ofs/tools/*.ofs "$ROOT/usr/local/share/ofs/tools/" 2>/dev/null || true
          cp ofs/ofscc/fileio.ofs "$ROOT/usr/local/share/ofs/ofscc/" 2>/dev/null || true
          cp -r ofs/bootstrap/* "$ROOT/usr/local/share/ofs/ofscc-src/" 2>/dev/null || true
          mkdir -p "$ROOT/usr/local/lib"
          cp selfhost/libofs_runtime.a "$ROOT/usr/local/lib/"

          "$ROOT/usr/local/bin/ofs" version | grep -F "ofs ${VERSION} - Obsidian Fault Script"
          OFS_RUNTIME="$ROOT/usr/local/lib/libofs_runtime.a" "$ROOT/usr/local/bin/ofs" check ofs/examples/webserver_demo.ofs
          (cd ofs/examples && "$GITHUB_WORKSPACE/$ROOT/usr/local/bin/ofs" check bedrock_gateway.ofs)
          OFS_RUNTIME="$ROOT/usr/local/lib/libofs_runtime.a" "$ROOT/usr/local/bin/ofs" build ofs/tests/selfhost_stdlib_smoke.ofs -o "$ROOT/usr/local/bin/stdlib-smoke"
          "$ROOT/usr/local/bin/stdlib-smoke"
          OFS_RUNTIME="$ROOT/usr/local/lib/libofs_runtime.a" "$ROOT/usr/local/bin/ofs" build ofs/tests/ui_stdlib_smoke.ofs -o "$ROOT/usr/local/bin/ui-smoke"
          "$ROOT/usr/local/bin/ui-smoke"
          OFS_RUNTIME="$ROOT/usr/local/lib/libofs_runtime.a" "$ROOT/usr/local/bin/ofs" build ofs/tests/window_runtime_smoke.ofs -o "$ROOT/usr/local/bin/window-smoke"
          "$ROOT/usr/local/bin/window-smoke"
          rm -f "$ROOT/usr/local/bin/stdlib-smoke"
          rm -f "$ROOT/usr/local/bin/ui-smoke" "$ROOT/usr/local/bin/window-smoke"

          COMPONENT_PKG="ofs-macos-arm64-component-${TAG}.pkg"
          pkgbuild --root "$ROOT" \
            --identifier com.obsidian-fault-script.ofs \
            --version "$VERSION" \
            --install-location / \
            "$COMPONENT_PKG"

          mkdir -p pkg-resources
          cp docs/legal/LICENSE pkg-resources/LICENSE.txt
          cat > distribution.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="1">
            <title>Obsidian Fault Script</title>
            <license file="LICENSE.txt"/>
            <options customize="never" require-scripts="false"/>
            <domains enable_anywhere="false" enable_currentUserHome="false" enable_localSystem="true"/>
            <choices-outline>
              <line choice="ofs"/>
            </choices-outline>
            <choice id="ofs" title="Obsidian Fault Script">
              <pkg-ref id="com.obsidian-fault-script.ofs"/>
            </choice>
            <pkg-ref id="com.obsidian-fault-script.ofs" version="$VERSION" onConclusion="none">$COMPONENT_PKG</pkg-ref>
          </installer-gui-script>
          EOF

          PKG="ofs-macos-arm64-installer-${TAG}.pkg"
          productbuild --distribution distribution.xml --resources pkg-resources --package-path . "$PKG"
          echo "pkg=$PKG" >> "$GITHUB_ENV"
          ls -lh "$PKG"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64-${{ needs.version.outputs.tag }}
          path: ${{ env.pkg }}

  # ── Windows ──────────────────────────────────────────────────────────
  build-windows:
    name: Build (windows-x64)
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        shell: powershell
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\clang.exe")) {
            choco install llvm -y
          }
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y
          }
          "C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "C:\Program Files (x86)\NSIS" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build current self-hosted compiler
        shell: powershell
        run: |
          $toolDirs = @(
            "C:\Program Files\LLVM\bin",
            "C:\msys64\ucrt64\bin",
            "C:\Program Files\Git\mingw64\bin"
          ) | Where-Object { $_ -and (Test-Path $_) }
          $env:PATH = (($toolDirs -join ";") + ";" + $env:PATH)
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            Write-Error "clang was not found; required to link self-hosted LLVM IR on Windows."
            exit 1
          }
          New-Item -ItemType Directory -Path selfhost -Force | Out-Null
          Copy-Item "ofs\dist\ofscc.ll" "selfhost\ofscc.ll"
          & clang -O2 -c "ofs\runtime\ofs_runtime.c" -o "selfhost\ofs_runtime.obj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & llvm-ar rcs "selfhost\libofs_runtime.a" "selfhost\ofs_runtime.obj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $llvmIrFlags = @()
          $clangVersion = (& clang --version | Out-String)
          if ($clangVersion -match 'version 14\.') { $llvmIrFlags = @("-mllvm", "-opaque-pointers") }
          & clang -Wno-override-module @llvmIrFlags -O2 "selfhost\ofscc.ll" "selfhost\libofs_runtime.a" -o "selfhost\ofscc.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "selfhost\ofscc.exe")) {
            Write-Error "Self-hosted compiler was not produced."
            exit 1
          }
          & "selfhost\ofscc.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "selfhost\ofscc.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build NSIS installer
        shell: powershell
        run: |
          $TAG = "${{ needs.version.outputs.tag }}"
          $Version = $TAG.TrimStart("v")
          $RepoRoot = (Get-Location).Path
          $Dist = "$RepoRoot\windows-dist"
          $AssetsDir = "$RepoRoot\src/packaging\windows"
          New-Item -ItemType Directory -Path $Dist -Force | Out-Null

          Copy-Item "selfhost\ofscc.exe" "$Dist\ofscc.exe"
          Copy-Item "selfhost\libofs_runtime.a" "$Dist\libofs_runtime.a"
          Copy-Item "src/packaging\windows\ofs.cmd" "$Dist\ofs.cmd"
          (Get-Content "src/packaging\windows\ofs.ps1" -Raw).Replace("__OFS_VERSION__", $Version) | Set-Content "$Dist\ofs.ps1"
          Copy-Item "src/packaging\windows\install.cmd" "$Dist\install.cmd"
          Copy-Item "src/packaging\windows\install.ps1" "$Dist\install.ps1"
          foreach ($cmd in @("infuse", "uncover", "reinfuse")) {
            Copy-Item "src/packaging\windows\$cmd.ps1" "$Dist\" -ErrorAction SilentlyContinue
            Copy-Item "src/packaging\windows\$cmd.cmd" "$Dist\" -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Path "$Dist\stdlib" -Force | Out-Null
          Copy-Item "ofs\stdlib\*.ofs" "$Dist\stdlib\" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "$Dist\tools" -Force | Out-Null
          Copy-Item "ofs\tools\*.ofs" "$Dist\tools\" -ErrorAction SilentlyContinue
          Copy-Item "docs/legal/LICENSE" "$Dist\LICENSE.txt" -ErrorAction SilentlyContinue

          $VersionOutput = & "$Dist\ofs.cmd" version | Out-String
          if ($VersionOutput -notmatch [regex]::Escape("ofs $Version - Obsidian Fault Script")) {
            Write-Error "Packaged ofs version did not match $Version"
            exit 1
          }
          Write-Output $VersionOutput
          & "$Dist\ofscc.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $InstallerName = "ofs-windows-x64-installer-${TAG}.exe"
          $InstallerPath = "$RepoRoot\$InstallerName"
          $nsis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $nsis) {
            Write-Error "NSIS makensis was not found; Windows release must produce an installer exe."
            exit 1
          }
          & makensis `
            "/DOUTPUT=$InstallerPath" `
            "/DDIST_DIR=$Dist" `
            "/DASSETS_DIR=$AssetsDir" `
            src/packaging\windows\installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "installer_exe=$InstallerPath" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-ChildItem $InstallerPath

      - name: Upload installer exe
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-installer-${{ needs.version.outputs.tag }}
          path: ${{ env.installer_exe }}

  # ── VS Code Extension ───────────────────────────────────────────────
  vscode_extension:
    name: Package VS Code Extension
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update extension version
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${TAG#v}"
          node -e "const fs=require('fs');const p='src/vscode-extension/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='${VERSION}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Package extension
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${TAG#v}"
          mkdir -p src/vscode-extension/bin/linux-x64/tools
          sed "s/__OFS_VERSION__/${VERSION}/g" src/packaging/linux/ofs > src/vscode-extension/bin/linux-x64/ofs
          chmod +x src/vscode-extension/bin/linux-x64/ofs
          cp ofs/tools/*.ofs src/vscode-extension/bin/linux-x64/tools/
          cp ofs/stdlib/*.ofs src/vscode-extension/bin/linux-x64/stdlib/
          cd src/vscode-extension
          rm -f *.vsix  
          npm ci
          npm run package

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ needs.version.outputs.tag }}
          path: "src/vscode-extension/*.vsix"

  # ── Publish ─────────────────────────────────────────────────────────
  publish:
    name: Publish Release
    needs: [version, build-linux, build-macos, build-windows, vscode_extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build changelog
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          PREV=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p')
          if [ -z "$PREV" ]; then
            LOG=$(git log --pretty="- %s (%h)" HEAD)
          else
            LOG=$(git log --pretty="- %s (%h)" ${PREV}..HEAD)
          fi
          printf "## Changes\n\n%s\n" "$LOG" > RELEASE.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.deb *.rpm *.pkg *.pkg.tar.zst *.exe *.vsix 2>/dev/null > CHECKSUMS.sha256 || true
          cat CHECKSUMS.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: OFS ${{ needs.version.outputs.tag }}
          body_path: RELEASE.md
          files: |
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.pkg
            artifacts/*.pkg.tar.zst
            artifacts/*.exe
            artifacts/*.vsix
            artifacts/CHECKSUMS.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
